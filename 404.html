<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in the clouds — S. SADHASRI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a18">
  <style>
    :root {
      --cyan: #67e8f9;
      --mag: #e879f9;
      --muted: #9fb0cc;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Sora", system-ui, -apple-system, sans-serif;
      color: #f8fafc; text-align: center; padding: 32px;
      background:
        radial-gradient(1100px 620px at 72% -10%, #134e7a 0%, transparent 62%),
        radial-gradient(900px 520px at 8% 110%, #4c1d95 0%, transparent 58%),
        #060a18;
    }
    .card { max-width: 560px; }
    .sigil { width: 84px; height: 84px; margin: 0 auto 22px; }
    .sigil circle, .sigil polygon { transform-origin: 50% 50%; }
    .sigil .ring { animation: spin 26s linear infinite; }
    .sigil .ring2 { animation: spin 18s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: clamp(30px, 7vw, 46px); margin: 0 0 10px; letter-spacing: 0.02em; }
    h1 span { background: linear-gradient(90deg, var(--cyan), var(--mag)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 14px; }
    .mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
    a.btn {
      text-decoration: none; color: #f8fafc; border: 1px solid rgba(56,189,248,0.45);
      background: rgba(8,14,30,0.7); padding: 10px 18px; border-radius: 10px;
      font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.06em;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    a.btn:hover { border-color: var(--cyan); box-shadow: 0 0 22px rgba(56,189,248,0.35); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="sigil" viewBox="0 0 90 90">
      <circle class="ring" cx="45" cy="45" r="42" fill="none" stroke="rgba(56,189,248,0.35)" stroke-width="1.5" stroke-dasharray="3 6"/>
      <circle class="ring2" cx="45" cy="45" r="33" fill="none" stroke="rgba(232,121,249,0.45)" stroke-width="1.5" stroke-dasharray="7 9"/>
      <polygon points="45,14 74,68 16,68" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <circle cx="45" cy="48" r="6" fill="#38bdf8"/>
    </svg>
    <h1>lost in <span>the clouds</span></h1>
    <p>That isle does not exist — the wind carried this page somewhere else.</p>
    <p class="mono" style="color:#64748b">404 · THE FLOATING REALM</p>
    <div class="links">
      <a class="btn" href="/floating-isles/">← return to the isles</a>
      <a class="btn" href="https://github.com/SadhaSri697" target="_blank" rel="noopener">github ↗</a>
    </div>
  </div>
</body>
</html>
