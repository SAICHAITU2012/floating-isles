name: Deploy the Floating Realm

# Every push to main lands on GitHub Pages within a minute or two.
# No tunnel, no local server, no laptop that has to stay awake: Pages is a
# static CDN with 99.9%+ uptime, so the link is the same URL forever.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-deploy monthly so a stale build never rots, even with no commits.
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the build is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every file index.html asks for must exist
        run: node tools/verify-build.mjs
      - name: Syntax-check the two big scripts
        run: |
          node --check app.js
          node --check world.js
          node --check tools/server.mjs

  qa:
    name: Headless render QA (stations must load with zero console errors)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve the site locally
        run: |
          node tools/server.mjs &
          sleep 2
      - name: Render every station in headless Chrome and gate on errors
        env:
          CI: "1"
        run: |
          set -e
          # find a Chrome binary (runner images differ)
          CHROME_BIN=""
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then CHROME_BIN="$c"; break; fi
          done
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::No Chrome/Chromium found on the runner — cannot run render QA"
            exit 1
          fi
          echo "using chrome: $CHROME_BIN"
          export CHROME_BIN
          fail=0
          for st in 0 1 2 3 4; do
            echo "== station $st =="
            set +e
            node tools/qa.mjs \
              --url "http://127.0.0.1:8099/?at=$st" \
              --out "qa/ci_st$st.png" \
              --width 1280 --height 800 --wait 8000 --settle-ms 45000 \
              --settle "Boolean(window.__WORLD_LOADED)" \
              --probe "JSON.stringify({loaded:!!window.__WORLD_LOADED})" \
              > "qa/ci_st$st.json" 2> "qa/ci_st$st.stderr"
            rc=$?
            set -e
            cat "qa/ci_st$st.json" || true
            if [ $rc -ne 0 ]; then
              echo "::error::qa.mjs exited $rc at station $st — see $(cat qa/ci_st$st.stderr | head -3)"
              fail=1
              continue
            fi
            node -e "
              const fs = require('fs');
              let r; try { r = JSON.parse(fs.readFileSync('qa/ci_st$st.json','utf8')); }
              catch (e) { console.error('::error::unparseable qa report at station $st'); process.exit(1); }
              const loaded = r.probe && JSON.parse(r.probe).loaded;
              if (!loaded) { console.error('::error::world did NOT load at station ' + '$st' + ' — errors: ' + JSON.stringify(r.errors)); process.exit(1); }
              if ((r.errors||[]).length) { console.error('::error::console errors at station ' + '$st' + ': ' + JSON.stringify(r.errors)); process.exit(1); }
              console.log('station $st OK — 0 errors, world loaded');
            " || fail=1
          done
          exit $fail

      - name: Upload QA evidence (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            qa/ci_st*.json
            qa/ci_st*.png
            qa/ci_st*.stderr
          if-no-files-found: ignore

  deploy:
    name: Publish to GitHub Pages
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only files the page needs)
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
