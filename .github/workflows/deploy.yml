name: Deploy the Floating Realm

# Every push to main lands on GitHub Pages within a minute or two.
# No tunnel, no local server, no laptop that has to stay awake: Pages is a
# static CDN with 99.9%+ uptime, so the link is the same URL forever.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-deploy monthly so a stale build never rots, even with no commits.
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the build is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every file index.html asks for must exist
        run: node tools/verify-build.mjs
      - name: Syntax-check the two big scripts
        run: |
          node --check app.js
          node --check world.js
          node --check tools/server.mjs

  qa:
    name: Headless render QA (stations must load with zero console errors)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serve the site locally
        run: |
          node tools/server.mjs &
          sleep 2
      - name: Render every station in headless Chrome and gate on errors
        env:
          CI: "1"
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -e
          command -v google-chrome >/dev/null || { echo "google-chrome not found on runner"; exit 1; }
          for st in 0 1 2 3 4; do
            echo "== station $st =="
            node tools/qa.mjs \
              --url "http://127.0.0.1:8099/?at=$st" \
              --out "qa/ci_st$st.png" \
              --width 1280 --height 800 --wait 8000 \
              --settle "Boolean(window.__WORLD_LOADED)" \
              --probe "JSON.stringify({loaded:!!window.__WORLD_LOADED})" \
              | tee "qa/ci_st$st.json"
            node -e "
              const r = JSON.parse(require('fs').readFileSync('qa/ci_st$st.json','utf8'));
              if (!r.probe || !JSON.parse(r.probe).loaded) { console.error('world did not load at station $st'); process.exit(1); }
              if ((r.errors||[]).length) { console.error('console errors at station $st:', r.errors); process.exit(1); }
            "
          done

  deploy:
    name: Publish to GitHub Pages
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only files the page needs)
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
